name: Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 tools/check_vendor.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm test

  msi:
    needs: test
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Build per-machine MSI
        run: npx electron-builder --win msi --x64 --publish never

      - name: Verify MSI exists
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI produced" }
          $msi | Format-List Name, Length
          "MSI_NAME=$($msi.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: qa-dashboard-msi
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 14
