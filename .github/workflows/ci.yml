name: QA Set CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make deps
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: contracts/
          if-no-files-found: error
