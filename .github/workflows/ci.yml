name: QA Set CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make release-tag-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve vendored QA Sentinels revision
        id: vendor
        run: python3 -c 'import json; print("commit=" + json.load(open("sentinels-vendor.json"))["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: scripting-drafts/QA-Sentinels
          ref: ${{ steps.vendor.outputs.commit }}
          path: .qa-sentinels-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make deps
      - name: Test
        env:
          QA_SENTINELS_SOURCE: ${{ github.workspace }}/.qa-sentinels-source
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: contracts/
          if-no-files-found: error
