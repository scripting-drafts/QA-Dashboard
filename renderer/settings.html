<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>QA Sentinels Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-window">
  <main class="settings-page">
    <section class="settings-panel">
      <h1>QA Sentinels settings</h1>
      <p class="muted settings-intro">Command, repository, cycle, and retention.</p>
      <form id="settings-form">
        <label>QA Sentinels command <input id="set-sentinels-bin" type="text" placeholder="auto-detect" autofocus></label>
        <label>QA Sentinels root <input id="set-sentinels-root" type="text" placeholder="auto-detect"></label>
        <label>Fallback cycle (minutes) <input id="set-sentinels-cycle" type="text" placeholder="10"></label>
        <p class="settings-group">Cycle and retention</p>
        <label>Cycle cadence (hours) <input id="set-sen-cycle-hours" type="text" inputmode="decimal" placeholder="1"></label>
        <label>Drafts retention (days) <input id="set-sen-drafts-days" type="text" inputmode="numeric" placeholder="30"></label>
        <label>Raise gate lookback (days) <input id="set-sen-lookback-days" type="text" inputmode="numeric" placeholder="30"></label>
        <label>Events retention (days) <input id="set-sen-events-days" type="text" inputmode="numeric" placeholder="0"></label>
        <label>Samples retention (days) <input id="set-sen-samples-days" type="text" inputmode="numeric" placeholder="0"></label>
        <label>proc_snap retention (days) <input id="set-sen-proc-days" type="text" inputmode="numeric" placeholder="0"></label>
        <label>Inventory retention (days) <input id="set-sen-inventory-days" type="text" inputmode="numeric" placeholder="0"></label>
        <p id="settings-status" class="settings-status" role="status" aria-live="polite" hidden></p>
        <div class="settings-actions">
          <button id="settings-close" type="button">Close</button>
          <button id="settings-save" class="primary" type="submit">Save</button>
        </div>
      </form>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
